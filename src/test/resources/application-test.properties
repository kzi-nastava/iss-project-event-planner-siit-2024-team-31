# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Force H2 dialect for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Fix ID generation for H2
spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.properties.hibernate.id.optimizer.pooled.prefer_lo=true

# Disable Flyway for tests
spring.flyway.enabled=false

# H2 specific settings
spring.h2.console.enabled=true
spring.jpa.defer-datasource-initialization=true

# Override server configuration for tests
server.port=0
# Use random port for tests to avoid conflicts

# Test mail configuration
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test

# Test AWS configuration (dummy values)
aws.s3.access-key=test-access-key
aws.s3.secret-key=test-secret-key
aws.s3.region=us-east-1
aws.s3.bucket-name=test-bucket

# Test JWT configuration
security.jwt.secret-key=test-secret-key-for-testing-purposes-must-be-long-enough
security.jwt.expiration-time=3600000
